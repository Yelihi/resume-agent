[project]
name = "resume-agent-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=46,<47",
    "fastapi>=0.115,<1",
    "openai>=2.0,<3",
    "paddleocr>=3.7,<4",
    "paddlepaddle==3.2.1",
    "pillow>=12,<13",
    "pymupdf>=1.26,<2",
    "pyjwt[crypto]>=2.10,<3",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.22,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
markers = [
    "ai: calls the real OpenAI API and is opt-in",
    "ocr: runs the real local OCR model",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true
