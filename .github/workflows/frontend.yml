name: Frontend CI and deployment
on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'deploy/cloudflare/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'deploy/cloudflare/**', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resume-frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
      - name: Test and build frontend and Worker
        run: |
          pnpm --dir frontend install --frozen-lockfile
          npm ci --ignore-scripts --prefix deploy/cloudflare
          pnpm --dir frontend test
          pnpm --dir frontend build
          node --test deploy/cloudflare/worker.test.mjs
          npm exec --prefix deploy/cloudflare -- wrangler deploy --config deploy/cloudflare/wrangler.jsonc --dry-run
      - name: Build browser-only preview
        env:
          VITE_PREVIEW_MODE: 'true'
        run: |
          pnpm --dir frontend exec vite build --outDir dist-preview
          cp deploy/cloudflare/preview-headers frontend/dist-preview/_headers
          npm exec --prefix deploy/cloudflare -- wrangler deploy --config deploy/cloudflare/wrangler.preview.jsonc --dry-run
          git diff --check
  frontend:
    needs: checks
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.ENABLE_FRONTEND_CD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
      - name: Reject an outdated main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - name: Build the same tested revision
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          npm ci --ignore-scripts --prefix deploy/cloudflare
      - name: Configure the private VPC binding
        env:
          VPC_SERVICE_ID: ${{ vars.CLOUDFLARE_VPC_SERVICE_ID }}
        run: |
          python3 - <<'PY'
          import json, os, uuid
          from pathlib import Path
          path = Path('deploy/cloudflare/wrangler.jsonc')
          config = json.loads(path.read_text())
          config['workers_dev'] = True
          config['vpc_services'] = [{'binding': 'RESUME_API', 'service_id': str(uuid.UUID(os.environ['VPC_SERVICE_ID']))}]
          path.write_text(json.dumps(config, indent=2) + '\n')
          PY
      - name: Publish SPA and API proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --prefix deploy/cloudflare -- wrangler deploy --config deploy/cloudflare/wrangler.jsonc

  preview:
    needs: checks
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.ENABLE_PREVIEW_CD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
      - name: Reject an outdated main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - name: Build preview without a backend
        env:
          VITE_PREVIEW_MODE: 'true'
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec tsc -b
          pnpm --dir frontend exec vite build --outDir dist-preview
          cp deploy/cloudflare/preview-headers frontend/dist-preview/_headers
          npm ci --ignore-scripts --prefix deploy/cloudflare
      - name: Publish browser-only preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --prefix deploy/cloudflare -- wrangler deploy --config deploy/cloudflare/wrangler.preview.jsonc
