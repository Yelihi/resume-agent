name: CI and deployment
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Keep an in-progress deployment intact. A newer main run waits for it.
concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.9.21
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          uv sync --frozen --project backend
          pnpm --dir frontend install --frozen-lockfile
          npm ci --ignore-scripts --prefix deploy/cloudflare
      - name: Backend tests (no paid AI or OCR model downloads)
        working-directory: backend
        run: uv run --frozen pytest -m 'not ai and not ocr' -q
      - name: Generated API contract must be committed
        run: |
          (cd backend && uv run --frozen python -m scripts.export_openapi ../frontend/openapi.json)
          pnpm --dir frontend types:api
          git diff --exit-code -- frontend/openapi.json frontend/src/infrastructure/http/schema.d.ts
      - name: Frontend tests and production build
        run: |
          pnpm --dir frontend test
          pnpm --dir frontend build
      - name: Deployment checks
        run: |
          node --test deploy/cloudflare/worker.test.mjs
          python3 -m unittest discover -s deploy -p 'test_*.py'
          python3 deploy/check-storage.py --self-test
          for script in deploy/run-app.sh deploy/run-backup.sh deploy/run-containers.sh deploy/run-release.sh; do /bin/sh -n "$script"; done
          npm exec --prefix deploy/cloudflare -- wrangler deploy --config deploy/cloudflare/wrangler.jsonc --dry-run
          git diff --check
  backend:
    needs: checks
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      github.event.repository.private == true && vars.ENABLE_NATIVE_CD == 'true'
    # Register only for the owner-controlled private repo. Never run PR jobs here.
    runs-on: [self-hosted, macOS, ARM64, resume-production]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject an outdated main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - name: Back up and deploy the tested native backend
        env:
          SERVER_ENV: ${{ vars.RESUME_SERVER_ENV_FILE }}
          BACKUP_ENV: ${{ vars.RESUME_BACKUP_ENV_FILE }}
          RELEASE_ROOT: ${{ vars.RESUME_RELEASE_ROOT }}
        run: /bin/sh deploy/run-release.sh "$SERVER_ENV" "$BACKUP_ENV" "$RELEASE_ROOT" "$GITHUB_SHA"
  frontend:
    needs: [checks, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
      - name: Reject an outdated main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - name: Build the same tested revision
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          npm ci --ignore-scripts --prefix deploy/cloudflare
      - name: Configure the private VPC binding
        env:
          VPC_SERVICE_ID: ${{ vars.CLOUDFLARE_VPC_SERVICE_ID }}
        run: |
          python3 - <<'PY'
          import json, os, uuid
          from pathlib import Path
          path = Path('deploy/cloudflare/wrangler.jsonc')
          config = json.loads(path.read_text())
          config['workers_dev'] = True
          config['vpc_services'] = [{'binding': 'RESUME_API', 'service_id': str(uuid.UUID(os.environ['VPC_SERVICE_ID']))}]
          path.write_text(json.dumps(config, indent=2) + '\n')
          PY
      - name: Publish SPA and API proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --prefix deploy/cloudflare -- wrangler deploy --config deploy/cloudflare/wrangler.jsonc
