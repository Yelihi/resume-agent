name: Backend CI and deployment
on:
  pull_request:
    branches: [main]
    paths: ['backend/**', 'deploy/**', '!deploy/cloudflare/**', 'frontend/openapi.json', 'frontend/src/infrastructure/http/schema.d.ts', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/**', '!deploy/cloudflare/**', 'frontend/openapi.json', 'frontend/src/infrastructure/http/schema.d.ts', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
# Keep an in-progress deployment intact. A newer main run waits for it.
concurrency:
  group: resume-backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.9.21
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          uv sync --frozen --project backend
          pnpm --dir frontend install --frozen-lockfile
      - name: Backend tests (no paid AI or OCR model downloads)
        working-directory: backend
        run: uv run --frozen pytest -m 'not ai and not ocr' -q
      - name: Generated API contract must be committed
        run: |
          (cd backend && uv run --frozen python -m scripts.export_openapi ../frontend/openapi.json)
          pnpm --dir frontend types:api
          git diff --exit-code -- frontend/openapi.json frontend/src/infrastructure/http/schema.d.ts
      - name: Deployment checks
        run: |
          python3 -m unittest discover -s deploy -p 'test_*.py'
          python3 deploy/check-storage.py --self-test
          for script in deploy/run-app.sh deploy/run-backup.sh deploy/run-containers.sh deploy/run-release.sh; do /bin/sh -n "$script"; done
          git diff --check
  backend:
    needs: checks
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.ENABLE_NATIVE_CD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Request backup and deployment from the Mac
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/github-deploy.py request
